name: AutoCart Windows installer
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'autocart/**'
      - '.github/workflows/autocart-windows.yml'
  push:
    tags:
      - 'autocart-v*'
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: autocart
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check scripts
        run: npm run check
      - name: Run AutoCart unit tests
        run: npm test
      - name: Build Windows installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: AutoCart-Windows-Installer
          path: autocart/dist/*.exe
          if-no-files-found: error