name: Kroger one-shot cart test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kroger-one-shot.yml'

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - name: Execute authorized Kroger command
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            'https://seezeestudios.com/api/kroger/execute?nonce=3bbde904d037343b432777178d628db5bb6ae055664289edc46c4d9c30a9cbcf'
