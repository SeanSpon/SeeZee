<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650"><rect width="1000" height="650" rx="18" fill="#0e1422"/><text x="40" y="48" fill="#81a6ff" font-size="19" font-family="Arial">SEEZEE STUDIO • ILLUSTRATED GUIDE</text><text x="40" y="105" fill="#ffffff" font-size="47" font-weight="bold" font-family="Arial">AutoCart Dashboard</text><rect x="40" y="138" width="920" height="110" rx="18" fill="#202d45" stroke="#4265a1"/><text x="70" y="175" fill="#fff" font-family="Arial" font-weight="bold" font-size="27">1. Open Practice Mode</text><text x="70" y="211" fill="#c5d4eb" font-family="Arial" font-size="19">Try pretend shopping first. Nothing is charged.</text><rect x="650" y="161" width="260" height="58" rx="12" fill="#4279de"/><text x="674" y="197" fill="white" font-family="Arial" font-size="20">Open Practice Mode</text><rect x="40" y="266" width="920" height="145" rx="18" fill="#182237" stroke="#36435e"/><text x="70" y="309" fill="white" font-family="Arial" font-weight="bold" font-size="27">2. Add product links</text><rect x="70" y="327" width="580" height="52" rx="10" fill="#0b1528" stroke="#74809b"/><text x="90" y="359" fill="#b1bed2" font-family="Arial" font-size="18">https://store.com/products/your-item</text><rect x="665" y="327" width="245" height="52" rx="10" fill="#3464b1"/><text x="699" y="359" fill="white" font-size="19" font-family="Arial">+ Add product</text><rect x="40" y="429" width="920" height="172" rx="18" fill="#182237" stroke="#36435e"/><text x="70" y="471" fill="white" font-family="Arial" font-weight="bold" font-size="27">3. Start or STOP monitoring</text><rect x="70" y="501" width="375" height="69" rx="12" fill="#477fea"/><text x="108" y="544" fill="white" font-size="26" font-family="Arial" font-weight="bold">▶ START WATCHING</text><rect x="470" y="501" width="440" height="69" rx="12" fill="#ae364f"/><text x="630" y="544" fill="white" font-size="26" font-family="Arial" font-weight="bold">■ STOP</text><text x="40" y